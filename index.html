<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Farmacéutico</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a url('farma.png') no-repeat center center fixed;
            background-size: cover; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-box {
            background: transparent; 
            padding: 45px 40px;
            border-radius: 24px;
            border: 2px solid rgba(59, 130, 246, 0.75); 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 0 20px rgba(59, 130, 246, 0.15); 
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 10px rgba(59, 130, 246, 0.6));
        }

        h2 {
            color: #ffffff;
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .subtitle {
            color: #e2e8f0;
            margin: 0 0 35px 0;
            font-weight: 500;
            font-size: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .input-group {
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #60a5fa;
            font-size: 16px;
            pointer-events: none;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: transparent; 
            border: 1.5px solid rgba(255, 255, 255, 0.4); 
            border-radius: 14px;
            font-size: 16px;
            color: #ffffff; 
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        input:focus {
            outline: none;
            border-color: #60a5fa; 
            background: rgba(15, 23, 42, 0.2); 
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
        }

        input::placeholder {
            color: #cbd5e1;
            opacity: 0.7;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(29, 78, 216, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }

        #message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">💊</div>
        <h2>Control Farmacéutico</h2>
        <p class="subtitle">Gestión de Inventario y Medicamentos</p>

        <div id="message"></div>

        <form id="loginForm">
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Usuario" value="admin" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Contraseña" value="1234" required>
                </div>
            </div>

            <button type="submit">Acceder al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');

            if (username === "admin" && password === "1234") {
                localStorage.setItem('currentUser', JSON.stringify({ 
                    username: "admin", 
                    role: "Farmacéutico Administrador" 
                }));
                messageDiv.style.display = "block";
                messageDiv.style.background = "rgba(212, 237, 218, 0.95)";
                messageDiv.style.color = "#155724";
                messageDiv.textContent = "✅ ¡Acceso Autorizado! Redirigiendo...";
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            } else {
                messageDiv.style.display = "block";
                messageDiv.style.background = "rgba(248, 215, 218, 0.95)";
                messageDiv.style.color = "#721c24";
                messageDiv.textContent = "❌ Credenciales incorrectas para el sistema";
            }
        });
    </script>
</body>
</html>
